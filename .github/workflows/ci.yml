# Checks every pull request and every push to main: the generated files are
# what the pinned API definitions and client releases generate, and every
# service of the API has a reference in every skill
# (scripts/generate.sh --check); every skill validates against the Agent
# Skills specification; the generator is formatted, lint-free and tested.
#
# The regeneration pull request is opened with the workflow token, which
# starts no pull_request run, so regenerate.yml dispatches this workflow on
# its branch instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Rust
        run: rustup toolchain install

      - name: Cache
        uses: 'Swatinem/rust-cache@v2'

      # The provider's schema is read with OpenTofu.
      - name: OpenTofu
        uses: 'opentofu/setup-opentofu@v1'
        with:
          tofu_wrapper: false

      - name: Generated files and coverage
        run: scripts/generate.sh --check

      - name: Agent Skills specification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Scripts
        run: shellcheck scripts/*.sh evals/bin/* evals/container/*.sh

  # The containers scripts/eval.sh runs the agents in: they build, the
  # `origin` release in them is the one clients.toml pins, the Terraform
  # and SDK toolchains work without a network, and the proxy starts. The
  # agents themselves run outside CI, with their credentials.
  eval-containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Agent images
        run: |
          origin="$(sed -n '/^\[cli\]/,/^\[/s/^version = "\(.*\)"/\1/p' clients.toml)"
          versions="$(sed -n 's/^readonly \(CLAUDE_CODE\|CODEX\)_VERSION="\(.*\)"/\1=\2/p' scripts/eval.sh)"
          for agent in claude codex; do
            case "${agent}" in
              claude) version="$(sed -n 's/^CLAUDE_CODE=//p' <<< "${versions}")" ;;
              codex) version="$(sed -n 's/^CODEX=//p' <<< "${versions}")" ;;
            esac
            docker build -f evals/container/Dockerfile --target with \
              --build-arg AGENT="${agent}" --build-arg AGENT_VERSION="${version}" \
              --build-arg ORIGIN_VERSION="${origin}" --build-arg SKILL=origin \
              -t "eval-${agent}" .
            docker run --rm --entrypoint /opt/origin/origin "eval-${agent}" --version
          done

      # The `origin` the agent calls reaches the fake API at the platform's
      # hosts, through the TLS front, as scripts/eval.sh runs it: no local
      # endpoint in its output, and the request in the fake API's log.
      - name: The CLI through the TLS front
        run: |
          mkdir -p tls/api tls/work && chmod -R a+rwX tls
          cp skills/origin/evals/worlds/shop.json tls/api/world.json
          hosts=()
          for reference in skills/origin/references/*.md; do
            service="$(basename "${reference}" .md)"
            [[ "${service}" != *-* ]] || continue
            hosts+=(--add-host "${service}.origincloudapis.eu:127.0.0.1"
              --add-host "${service}.eu-central1.origincloudapis.eu:127.0.0.1")
          done
          docker run -d --name fake-api --network none --user "$(id -u):$(id -g)" \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 "${hosts[@]}" \
            -v "${PWD}/tls/api:/api" --entrypoint /usr/local/bin/eval-fake-api eval-claude \
            --world /api/world.json --log /api/requests.log --env /api/endpoints.env
          for _ in $(seq 300); do [[ -s tls/api/endpoints.env ]] && break; sleep 0.1; done
          docker run --rm --network container:fake-api --user "$(id -u):$(id -g)" \
            -v "${PWD}/tls/work:/work" -e ORIGIN_EVAL_API=1 \
            -e ORIGIN_EVAL_PROFILE="$(jq -c .profile tls/api/world.json)" \
            eval-claude origin pvs list-volumes --output json > tls/out.json 2> tls/err.log
          jq -e '.volumes | length > 0' tls/out.json
          grep -E '^GET /v1[a-z0-9]*/projects/shop-prod/zones/[a-z0-9-]+/volumes 200' tls/api/requests.log
          if grep -n '127\.0\.0\.1' tls/out.json tls/err.log; then exit 1; fi
          docker rm -f fake-api

      # One agent's images for the Terraform and SDK skills: the toolchains
      # come before the agent's layer, so the other agent's would differ in
      # that layer alone.
      - name: Toolchain images
        run: |
          pin() { sed -n "/^\[$1\]/,/^\[/s/^$2 = \"\(.*\)\"/\1/p" clients.toml; }
          version="$(sed -n 's/^readonly CLAUDE_CODE_VERSION="\(.*\)"/\1/p' scripts/eval.sh)"
          for skill in origincloud-terraform origincloud-sdk; do
            docker build -f evals/container/Dockerfile --target with \
              --build-arg AGENT=claude --build-arg AGENT_VERSION="${version}" \
              --build-arg ORIGIN_VERSION="$(pin cli version)" --build-arg SKILL="${skill}" \
              --build-arg PROVIDER_SOURCE="$(pin terraform source)" \
              --build-arg PROVIDER_VERSION="$(pin terraform version)" \
              --build-arg SDK_GO_VERSION="$(pin sdk go)" \
              --build-arg SDK_RUST_VERSION="$(pin sdk rust)" \
              --build-arg SDK_TYPESCRIPT_VERSION="$(pin sdk typescript)" \
              -t "eval-${skill}" .
          done

      # What the tasks build, as an agent would, in the checks' container:
      # no network, the world's fake API for the plan.
      - name: Toolchains offline
        run: |
          mkdir -p work/tf work/go work/ts work/rs api && chmod -R a+rwX work api
          cp skills/origincloud-terraform/evals/worlds/platform.json api/world.json
          cat > work/tf/main.tf <<'HCL'
          terraform {
            required_providers {
              origincloud = { source = "origincloudhq/origincloud" }
            }
          }
          import {
            to = origincloud_pvs_volume.data
            id = "projects/my-project-123/zones/eu-central1-az1/volumes/vol-1a2b3c"
          }
          resource "origincloud_pvs_volume" "data" {
            project  = "my-project-123"
            zone     = "eu-central1-az1"
            size_gib = 100
          }
          HCL
          check() { docker run --rm --network none --user "$(id -u):$(id -g)" -v "${PWD}/work/$2:/work" -v "${PWD}/api:/checks" -e EVAL_CHECK_API=/checks "eval-$1" eval-check "$3"; }
          check origincloud-terraform tf 'tofu init -backend=false -input=false >/dev/null && terraform validate && eval-tofu-plan | grep "Plan: 1 to import, 0 to add, 0 to change, 0 to destroy"'
          check origincloud-sdk go 'go mod init example.com/x && go get go.origincloud.eu/sdk && printf "package main\nimport _ \"go.origincloud.eu/sdk/pvs/v1beta1\"\nfunc main() {}\n" > main.go && go mod tidy && go build ./...'
          check origincloud-sdk ts 'npm init -y >/dev/null && npm install @origincloud/core @origincloud/pvs && npm install -D typescript @types/node && echo "import { Client } from \"@origincloud/core\"; new Client();" > x.ts && npx tsc --noEmit --module nodenext --moduleResolution nodenext x.ts'
          check origincloud-sdk rs 'cargo init --quiet --name x && cargo add --quiet origincloud-pvs origincloud-core anyhow && cargo add --quiet tokio --features full && cargo build --quiet'
          # A login shell, as Codex runs commands in, finds them too.
          check origincloud-sdk go 'bash -lc "go version && cargo --version && node --version"'
          check origincloud-terraform tf 'bash -lc "tofu version && terraform version"'

      - name: Proxy image
        run: |
          docker build -f evals/container/proxy.Dockerfile -t eval-proxy .
          docker run -d --name proxy -e EVAL_ALLOW=api.anthropic.com eval-proxy
          sleep 2
          docker logs proxy
          test "$(docker inspect -f '{{.State.Running}}' proxy)" = true
