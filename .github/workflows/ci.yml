# Checks every pull request and every push to main: the generated files are
# what the pinned API definitions and client releases generate, and every
# service of the API has a reference in every skill
# (scripts/generate.sh --check); every skill validates against the Agent
# Skills specification; the generator is formatted, lint-free and tested.
#
# The regeneration pull request is opened with the workflow token, which
# starts no pull_request run, so regenerate.yml dispatches this workflow on
# its branch instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Rust
        run: rustup toolchain install

      - name: Cache
        uses: 'Swatinem/rust-cache@v2'

      # The provider's schema is read with OpenTofu.
      - name: OpenTofu
        uses: 'opentofu/setup-opentofu@v1'
        with:
          tofu_wrapper: false

      - name: Generated files and coverage
        run: scripts/generate.sh --check

      - name: Agent Skills specification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Scripts
        run: shellcheck scripts/*.sh
