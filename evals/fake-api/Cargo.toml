[package]
name = "origincloud-skills-fake-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A stand-in for Origin Cloud's API that the evals run the origin CLI against: it serves a world of resources from a file and records every request."

[[bin]]
name = "fake-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The local HTTP server the SDK's and the CLI's tests run against, at the
# commit the pinned CLI release is built on.
fake-server = { git = "https://github.com/origincloudhq/sdk-rust", rev = "37d10062c771d17b86d9907f94380930a48e85ba" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3.16"
